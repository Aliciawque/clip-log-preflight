name: Python preflight checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test standard-library implementation
        run: python3 -m unittest discover -s tests -v
      - name: Compile CLI
        run: python3 -m py_compile clip_log_preflight.py
      - name: Check help
        run: python3 clip_log_preflight.py --help
